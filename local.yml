---
# ============================================================================
#  Project 2 — your hardening playbook.   (ansible-pull runs THIS file)
#
#  ansible-pull looks for a file named local.yml at the root of your git repo,
#  and runs it ON the box itself (no SSH, no inventory needed).
#
#  To apply it on your box:
#     sudo ansible-pull -U https://github.com/<you>/<your-repo>.git
#
#  Goal: bring a broken box into the hardened target state (see the portal for
#  the 14 tasks and exactly what each one checks). Your playbook must be
#  IDEMPOTENT — running it a second time should report changed=0.
# ============================================================================

- name: Project 2 hardening
  hosts: localhost
  connection: local
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:

    # ----- EXAMPLE (safe to keep) — shows the shape of a task -------------
    - name: Example — make sure a package is present
      ansible.builtin.package:
        name: ca-certificates
        state: present
    # -------------------------------------------------------------------

    # ======================= Domain A — System / SSH =====================
    # SSH — disallow root login and password auth, then restart ssh.
    - name: Disallow root login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        create: true
        regexp: '^\s*PermitRootLogin\b'
        insertafter: BOF
        line: 'PermitRootLogin no'
      notify: Restart ssh

    - name: Disallow root password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        create: true
        regexp: '^\s*PasswordAuthentication\b'
        insertafter: BOF
        line: 'PasswordAuthentication no'
      notify: Restart ssh

    # Host firewall (UFW) — active, default-deny incoming, allow only SSH.
    - name: Ensure UFW is installed
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Set outgoing firewall policy to allow
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Set incoming firewall policy to deny
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Allow OpenSSH through firewall
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    # Remove the unauthorized scheduled job.
    - name: Remove unauthorized scheduled job
      ansible.builtin.file:
        path: /etc/cron.d/sysstat-collect
        state: absent

    # Stop + disable + remove the unnecessary service.
    - name: Stop unwanted service
      ansible.builtin.service:
        name: debugshell.service
        state: stopped
        enabled: false

    # Install fail2ban and make sure it protects sshd.
    - name: Install fail2ban
      ansible.builtin.package:
        name: fail2ban
        state: present

    - name: Configure fail2ban for SSH
      ansible.builtin.blockinfile:
        path: /etc/fail2ban/jail.d/sshd.local
        create: true
        block: |
          [sshd]
          enabled = true
          port = ssh
          filter = sshd
          logpath = /var/log/auth.log
          maxretry = 5
          bantime = 3600

    - name: Ensure fail2ban is running
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    # Fix the world-writable application directory.
    - name: Fix world-writable application directory
      ansible.builtin.file:
        path: /var/www/app/tmp
        state: directory
        mode: '0755'

    # ================= Domain B — Users / privilege escalation ===========
    # Remove or lock the unauthorized sudo account.
    - name: Remove unauthorized account
      ansible.builtin.user:
        name: svcbackup
        state: absent
        remove: true

    # Remove the passwordless-sudo (NOPASSWD) rule.
    - name: Remove passwordless-sudo rule from cloud-init users
      ansible.builtin.file:
        path: /etc/sudoers.d/90-cloud-init-Users
        state: absent

    - name: Remove passwordless-sudo rule from course file
      ansible.builtin.file:
        path: /etc/sudoers.d/90-course-nopasswd
        state: absent

    # Remove the unexpected SUID-root binary.
    - name: Remove SUID bit from flushcache
      ansible.builtin.file:
        path: /usr/local/bin/flushcache
        mode: '0755'

    # Fix the account that has a blank password.
    - name: Fix blank password
      ansible.builtin.user:
        name: guestsvc
        password_lock: true

    # Restrict the world-readable credentials file.
    - name: Restrict world-readable credentials
      ansible.builtin.file:
        path: /opt/app/config.yml
        mode: '0600'
        owner: root
        group: root

    # ================== Domain C — Database least-privilege ==============
    # Install the collection on the controller with:
    #     ansible-galaxy collection install community.mysql
    # Install its Python driver for the system Python before using the module.
    - name: Install PyMySQL for Ansible's system Python
      ansible.builtin.apt:
        name: python3-pymysql
        state: present
        update_cache: true

    - name: Scope webapp account
      community.mysql.mysql_user:
        name: webapp
        host: '%'
        priv: 'inventorydb.*:SELECT,INSERT,UPDATE,DELETE'
        append_privs: false
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Scope reporting account
      community.mysql.mysql_user:
        name: reporting
        host: '%'
        priv: 'inventorydb.*:SELECT'
        append_privs: false
        login_unix_socket: /var/run/mysqld/mysqld.sock

    # Tighten DB access hosts; drop anonymous/stale accounts.
    - name: Drop remote root access
      community.mysql.mysql_user:
        name: root
        host: '%'
        state: absent
        login_unix_socket: /var/run/mysqld/mysqld.sock

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
